function imRead(txt){try{const j=JSON.parse(txt),o=j&&j.app=='mock-revision-planner'&&j.data?j.data:j;if(!o||!Array.isArray(o.subs)||!Array.isArray(o.log))throw 0;IMP=o;const nt=o.subs.reduce((a,s)=>a+(s.t||[]).length,0),tk=((o.td||{}).items||[]).length;$('imsum').innerHTML=`<p>This file has ${o.subs.length} subjects, ${nt} topics, ${o.log.length} study sessions and ${tk} to-do tasks. Importing replaces the data on this device. A safety copy is kept so you can undo.</p><div class="row"><button class="go" onclick="imGo()">Replace my data</button><button onclick="IMP=null;imMsg('Import cancelled.')">Cancel</button></div>`}catch(e){IMP=null;imMsg('That file is not a valid planner export, so nothing was changed.')}}
function imGo(){if(!IMP)return;try{localStorage.setItem(KEY+'.prev',JSON.stringify(S))}catch(e){}S=IMP;IMP=null;S.sess=null;S.today=null;S.hist=S.hist||{};if(!['today','todo','calendar','subjects','progress'].includes(S.tab))S.tab='today';mig();migEx();save();render();toast('','<b>Data imported</b><span><a href="#" onclick="imUndo();return false" style="color:var(--ac)">Undo</a></span>')}
function imUndo(){try{const p=JSON.parse(localStorage.getItem(KEY+'.prev'));if(!p)throw 0;S=p;S.sess=null;save();render()}catch(e){toast('Nothing to undo.')}}
/* ---- customization: site, today layout, progress sections ---- */
const UIT=[['today','Today'],['todo','To-do'],['calendar','Calendar'],['subjects','Subjects'],['progress','Progress']],
UIS=[['tasks','Task list','l'],['alt','Refreshed list','l'],['todo','To-do for today','l'],['ses','Quick session','r'],['next','Next papers','r'],['help','How-to notes','r']];
const uiS_=()=>{const u=S.ui=S.ui||{};u.tabs=u.tabs||UIT.map(x=>x[0]);u.hid=u.hid||[];u.lab=u.lab||{};u.pr=u.pr||{o:[],h:[],k:[]};const t=u.tl=u.tl||{l:[],r:[],h:[]};UIS.forEach(([k,,d])=>{if(!t.l.includes(k)&&!t.r.includes(k)&&!t.h.includes(k))t[d].push(k)});return u};
function uiTabs(){const u=uiS_(),nm=Object.fromEntries(UIT),o=u.tabs.filter(k=>nm[k]);UIT.forEach(([k])=>{if(!o.includes(k))o.push(k)});const v=o.filter(k=>!u.hid.includes(k)).map(k=>[k,u.lab[k]||nm[k]]);if(!v.length)v.push(['today','Today']);if(S.tab!='set'&&!v.some(x=>x[0]==S.tab))S.tab=v[0][0];return v}
function uiApply(){const u=uiS_(),o=(S.td&&S.td.o)||{},r=[];
 r.push('.wrap{max-width:'+({narrow:'980px',full:'100%'}[u.w]||'1360px')+'}');
 if(u.fs)r.push('body{font-size:'+(+u.fs)+'px}');
 if(u.rad!=null)r.push('.card,.box{border-radius:'+(+u.rad)+'px}');
 if(/^#[0-9a-f]{6}$/i.test(u.acc||''))r.push('html:root[data-theme]{--ac:'+u.acc+'}');
 if(u.hsub)r.push('.sub{display:none}');
 if(u.dn=='compact')r.push('.card,.box{padding:12px}.task{padding:7px 0}nav{margin:8px 0 10px}');
 if(u.tc==1)r.push('#v-today:not(.hide){display:block}');
 if(u.pc==1)r.push('#v-progress:not(.hide){display:block}');
 if(o.cp==1)r.push('.tdi{padding:5px 4px}.tdd{margin-bottom:4px}');
 if(o.big==1)r.push('.tdn{font-size:18px}');
 if(o.pv==0)r.push('#tdpv{display:none}');
 if(o.hd==0)r.push('.tdhd{display:none}');
 let e=$('uiS');if(!e){e=document.createElement('style');e.id='uiS';document.head.appendChild(e)}e.textContent=r.join('');
 const h=document.querySelector('h1'),s=document.querySelector('.sub');if(h)h.textContent=u.ttl||'Mock Revision Planner';if(s){if(!s.dataset.d)s.dataset.d=s.textContent;s.textContent=u.sub||s.dataset.d}}
function uiToday(){const u=uiS_(),c1=document.querySelector('#v-today .tdc1'),c2=document.querySelector('#v-today .tdc2');if(!c1||!c2)return;const M={};document.querySelectorAll('#v-today [data-s]').forEach(e=>{M[e.dataset.s]=e});const t=u.tl;[['l',c1],['r',c2]].forEach(([s,c])=>t[s].forEach(k=>{if(M[k])c.appendChild(M[k])}));UIS.forEach(([k])=>{if(M[k])M[k].style.display=t.h.includes(k)?'none':''})}
function uiPrOrd(){const u=uiS_(),k=u.pr.k,o=u.pr.o.filter(x=>k.includes(x));k.forEach(x=>{if(!o.includes(x))o.push(x)});return o}
function uiProg(){const u=uiS_(),el=$('v-progress'),ch=[...el.children],keys=ch.map(c=>c.classList.contains('grid')?'Overview cards':(((c.querySelector('h2')||{}).textContent||'').trim()||'Other'));u.pr.k=keys;uiPrOrd().forEach(k=>{const i=keys.indexOf(k);if(i>=0)el.appendChild(ch[i])});ch.forEach((c,i)=>{c.style.display=u.pr.h.includes(keys[i])?'none':''})}
{const _p=progress;progress=function(){_p();uiProg()}}
function uiSet(k,v){uiS_()[k]=v;save();render()}
function uiLab(k,v){const u=uiS_();v=v.trim();if(v)u.lab[k]=v;else delete u.lab[k];save();render()}
function uiTabMv(k,d){const u=uiS_(),o=u.tabs.filter(x=>UIT.some(y=>y[0]==x));UIT.forEach(([x])=>{if(!o.includes(x))o.push(x)});const i=o.indexOf(k),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];u.tabs=o;save();render()}
function uiTabVis(k,v){const u=uiS_();u.hid=u.hid.filter(x=>x!=k);if(!v){if(!UIT.some(y=>y[0]!=k&&!u.hid.includes(y[0]))){render();return}u.hid.push(k)}save();render()}
function uiSec(k,s){const t=uiS_().tl;['l','r','h'].forEach(a=>{t[a]=t[a].filter(x=>x!=k)});t[s].push(k);save();render()}
function uiSecMv(k,d){const t=uiS_().tl,a=['l','r','h'].map(x=>t[x]).find(x=>x.includes(k)),i=a.indexOf(k),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function uiPrMv(i,d){const u=uiS_(),o=uiPrOrd(),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];u.pr.o=o;save();render()}
function uiPrVis(i,v){const u=uiS_(),k=uiPrOrd()[i];u.pr.h=u.pr.h.filter(x=>x!=k);if(!v)u.pr.h.push(k);save();render()}
function uiReset(){S.ui=null;save();render()}
function custom(){const u=uiS_(),nm=Object.fromEntries(UIT);uiTabs();if(!u.pr.k.length){try{progress()}catch(e){}}
 const tabs=u.tabs.filter(k=>nm[k]);UIT.forEach(([k])=>{if(!tabs.includes(k))tabs.push(k)});
 const SW=['#7fc8b2','#8aa9ff','#e3b05c','#e0706b','#c79bff','#73c28a','#ffa66b','#f08fc0'],cd=(h,b)=>`<div class="card"><h2>${h}</h2>${b}</div>`,ch=(f,v,l)=>`<label class="mu cset"><input type="checkbox" ${v?'checked':''} onchange="${f}"> ${l}</label>`;
 const look=`<div class="cset"><span>Accent colour</span><input type="color" value="${/^#[0-9a-f]{6}$/i.test(u.acc||'')?u.acc:'#7fc8b2'}" onchange="uiSet('acc',this.value)" style="padding:2px;width:44px">${SW.map(c=>`<button class="sw" style="background:${c}" onclick="uiSet('acc','${c}')" aria-label="Accent ${c}"></button>`).join('')}<button onclick="uiSet('acc','')">Default</button></div>
 <div class="cset"><span>Theme</span><button onclick="setTheme('dark')">Dark</button><button onclick="setTheme('light')">Light</button></div>
 <div class="cset"><span>Text size</span><select onchange="uiSet('fs',+this.value)">${tdOpt([[0,'Normal'],[14,'Small'],[17,'Large'],[19,'Extra large']],u.fs||0)}</select></div>
 <div class="cset"><span>Page width</span><select onchange="uiSet('w',this.value)">${tdOpt([['narrow','Narrow'],['wide','Wide'],['full','Full screen']],u.w||'wide')}</select></div>
 <div class="cset"><span>Spacing</span><select onchange="uiSet('dn',this.value)">${tdOpt([['','Comfortable'],['compact','Compact']],u.dn||'')}</select></div>
 <div class="cset"><span>Corner roundness</span><input type="range" min="0" max="24" value="${u.rad==null?12:u.rad}" onchange="uiSet('rad',+this.value)"></div>`;
 const txt=`<div class="cset"><span>Site title</span><input value="${E(u.ttl||'')}" placeholder="Mock Revision Planner" onchange="uiSet('ttl',this.value.trim())" style="flex:1;min-width:160px"></div><div class="cset"><span>Subtitle</span><input value="${E(u.sub||'')}" placeholder="Default subtitle" onchange="uiSet('sub',this.value.trim())" style="flex:1;min-width:160px"></div>${ch("uiSet('hsub',this.checked)",u.hsub,'Hide the subtitle')}`;
 const tb=tabs.map(k=>`<div class="cset"><button class="x" onclick="uiTabMv('${k}',-1)" aria-label="Move up">\u25b2</button><button class="x" onclick="uiTabMv('${k}',1)" aria-label="Move down">\u25bc</button><input value="${E(u.lab[k]||nm[k])}" onchange="uiLab('${k}',this.value)" style="width:150px"><label class="mu"><input type="checkbox" ${u.hid.includes(k)?'':'checked'} onchange="uiTabVis('${k}',this.checked)"> Show</label></div>`).join('');
 const t=u.tl,nS=Object.fromEntries(UIS.map(x=>[x[0],x[1]])),sc=[].concat(t.l,t.r,t.h).map(k=>{const sd=t.l.includes(k)?'l':t.r.includes(k)?'r':'h';return `<div class="cset"><button class="x" onclick="uiSecMv('${k}',-1)" aria-label="Move up">\u25b2</button><button class="x" onclick="uiSecMv('${k}',1)" aria-label="Move down">\u25bc</button><span style="min-width:130px">${nS[k]}</span><select onchange="uiSec('${k}',this.value)">${tdOpt([['l','Left column'],['r','Right column'],['h','Hidden']],sd)}</select></div>`}).join('');
 const ord=uiPrOrd(),pg=ord.length?ord.map((k,i)=>`<div class="cset"><button class="x" onclick="uiPrMv(${i},-1)" aria-label="Move up">\u25b2</button><button class="x" onclick="uiPrMv(${i},1)" aria-label="Move down">\u25bc</button><span style="min-width:170px">${E(k)}</span><label class="mu"><input type="checkbox" ${u.pr.h.includes(k)?'':'checked'} onchange="uiPrVis(${i},this.checked)"> Show</label></div>`).join(''):'<p class="mu">Open the Progress tab once, then come back.</p>';
 $('v-set').innerHTML=`<p class="mu" style="margin:0 0 10px">Choose how the site looks, which pages and sections show, and where things sit. Everything saves as you go.</p><div class="cg"><div>${cd('Look',look)}${cd('Text',txt)}${cd('Pages: order, names, show or hide',tb)}</div><div>${cd('Today page layout',`<div class="cset"><span>Columns</span><select onchange="uiSet('tc',+this.value)">${tdOpt([[0,'Two on wide screens'],[1,'Always one']],u.tc||0)}</select></div>`+sc)}${cd('Progress page sections',`<div class="cset"><span>Columns</span><select onchange="uiSet('pc',+this.value)">${tdOpt([[0,'Two on wide screens'],[1,'Always one']],u.pc||0)}</select></div>`+pg)}</div></div><div class="cg"><div>${tdOptions(1)}</div><div>${backup()}<div class="card"><button onclick="uiReset()">Reset looks and layout</button><p class="mu" style="margin:6px 0 0">Puts looks, pages and layout back to the original. Your tasks and data stay.</p></div></div></div>`}
/* ---- to-do options ---- */
function tdSync(D){if(!D.ty)return;Object.keys(TDC).forEach(k=>{delete TDC[k]});Object.keys(TDK).forEach(k=>{delete TDK[k]});D.ty.forEach(t=>{TDC[t.k]=[t.n||'Type',t.c||'#8aa9ff'];TDK[t.k]=t.w||''});TDC.oth=[D.on||'Other',D.oc||'#9aa5b8']}
function tdTyL(){const D=tdS();if(!D.ty)D.ty=Object.keys(TDC).filter(k=>k!='oth').map(k=>({k,n:TDC[k][0],c:TDC[k][1],w:(TDK[k]||'')+(D.kw[k]?','+D.kw[k]:'')}));return D.ty}
function tdTy(i,f,v){const D=tdS();D.ty[i][f]=v.trim?v.trim():v;if(f=='n'&&!D.ty[i].n)D.ty[i].n='Type';tdSync(D);save();rr()}
function tdTyDel(i){const D=tdS();D.ty.splice(i,1);tdSync(D);save();rr()}
function tdTyAdd(){const D=tdS();tdTyL();D.ty.push({k:'t'+Date.now().toString(36),n:'New type',c:'#8aa9ff',w:''});tdSync(D);save();rr()}
function tdOth(f,v){const D=tdS();D[f]=v.trim()||(f=='on'?'Other':'#9aa5b8');tdSync(D);save();rr()}
function tdO(k,v){const D=tdS();D.o=D.o||{};D.o[k]=v?1:0;save();rr()}
function tdTags(){const s=new Set();tdS().items.forEach(k=>(k.tg||[]).forEach(t=>s.add(t)));return [...s].sort()}
function tdOptions(op){const D=tdS(),L=tdTyL(),o=D.o||{},ck=(k,l,off)=>`<label class="mu cset" style="margin:2px 0"><input type="checkbox" ${(off?o[k]==1:o[k]!==0)?'checked':''} onchange="tdO('${k}',this.checked)"> ${l}</label>`,H=t=>`<h3 style="margin:14px 0 4px;font:600 14px Georgia,serif">${t}</h3>`;
 return `<div class="card"><details${op?' open':''}><summary><b>To-do options</b>: types, what each task shows, layout</summary>${H('Types and auto-sort words')}<p class="mu" style="margin:0 0 6px">A task gets the first type whose words appear in its title. Separate words with commas.</p>${L.map((t,i)=>`<div class="cset"><input type="color" value="${t.c}" onchange="tdTy(${i},'c',this.value)" style="padding:2px;width:42px"><input value="${E(t.n)}" onchange="tdTy(${i},'n',this.value)" style="width:120px"><input value="${E(t.w)}" placeholder="words, comma separated" onchange="tdTy(${i},'w',this.value)" style="flex:1;min-width:130px"><button class="x" onclick="tdTyDel(${i})" aria-label="Delete type">\u2715</button></div>`).join('')}<div class="cset"><input type="color" value="${TDC.oth[1]}" onchange="tdOth('oc',this.value)" style="padding:2px;width:42px"><input value="${E(TDC.oth[0])}" onchange="tdOth('on',this.value)" style="width:120px"><span class="mu">Everything else</span></div><div class="row"><button onclick="tdTyAdd()">+ Add a type</button></div>${H('What each task shows')}<div class="row" style="gap:4px 16px">${ck('cat','Type')}${ck('sub','Subject')}${ck('due','Due date')}${ck('pri','Priority')}${ck('tag','Tags and minutes')}${ck('ext','Steps, repeat, notes')}</div>${H('Page')}<div class="row" style="gap:4px 16px">${ck('hd','Progress header')}${ck('pv','Auto-detect preview')}${ck('cp','Compact rows',1)}${ck('big','Larger task text',1)}</div><p class="mu">Type #tag and ~30m when adding a task to give it a tag or a time estimate.</p></details></div>`}
/* ---- exam paper dates ---- */
function exD(d){const x=new Date(d+'T12:00');return {w:x.toLocaleDateString('en-GB',{weekday:'short'}),n:x.getDate(),m:x.toLocaleDateString('en-GB',{month:'short'}),y:x.getFullYear()}}
function exCd(d){const n=days(d);return n<0?['Done','var(--mu)']:n==0?['Today','var(--r)']:n==1?['Tomorrow','var(--r)']:n<=3?['in '+n+' days','var(--r)']:n<=7?['in '+n+' days','var(--a)']:['in '+n+' days','var(--g)']}
function exCard(i,x){const a=exD(x.d),c=exCd(x.d);return `<div class="task" style="gap:12px;flex-wrap:nowrap${days(x.d)<0?';opacity:.55':''}"><div style="text-align:center;min-width:56px;background:var(--sf2);border-radius:10px;padding:5px 6px;line-height:1.15"><div class="mu" style="font-size:11px;text-transform:uppercase">${a.w}</div><div style="font:700 22px Georgia,serif">${a.n}</div><div class="mu" style="font-size:11px;text-transform:uppercase">${a.m}</div></div><div class="tt" style="min-width:0;flex:1"><b>${i==null?'':E(shn(i))+': '}${E(x.n)}</b><br><span class="mu">${a.w} ${a.n} ${a.m} ${a.y} at ${E(x.t)}</span></div><span class="tdc" style="color:${c[1]};margin:0">${c[0]}</span></div>`}
function exList(i){const s=S.subs[i],L=(s.ex||[]).map((x,j)=>({x,j})).sort((a,b)=>a.x.d+a.x.t<b.x.d+b.x.t?-1:1);return `<div style="margin:0 0 10px"><b>Exam papers</b>${L.length?L.map(({x})=>exCard(null,x)).join(''):'<p class="mu" style="margin:4px 0">No papers added yet.</p>'}<details${S.exo==i?' open':''} style="margin-top:6px"><summary class="mu">Add or edit papers</summary>${L.map(({x,j})=>`<div class="row"><input type="date" value="${x.d}" onchange="exSet(${i},${j},'d',this.value)"><input type="time" value="${x.t}" onchange="exSet(${i},${j},'t',this.value)"><input value="${E(x.n)}" onchange="exSet(${i},${j},'n',this.value)" style="flex:1;min-width:120px"><button class="x" onclick="exDel(${i},${j})" aria-label="Delete paper">\u2715</button></div>`).join('')}<div class="row"><button onclick="exAdd(${i})">+ Add a paper</button></div></details></div>`}
function exSet(i,j,f,v){S.exo=i;S.subs[i].ex[j][f]=v;save();rr()}
function exDel(i,j){S.exo=i;S.subs[i].ex.splice(j,1);save();rr()}
function exAdd(i){const s=S.subs[i];S.exo=i;s.ex=s.ex||[];s.ex.push({d:TD(),t:'09:00',n:'Paper'});save();rr()}
function exNext(i){const s=S.subs[i],x=(s.ex||[]).filter(y=>days(y.d)>=0).sort((a,b)=>a.d+a.t<b.d+b.t?-1:1)[0];if(!x)return 'No paper dates yet';const a=exD(x.d);return 'Next paper: '+a.w+' '+a.n+' '+a.m+' \u00b7 '+exCd(x.d)[0]}
function exTable(){const L=[];S.subs.forEach((s,i)=>{if(!on(s)||!s.ex)return;s.ex.forEach(x=>{if(days(x.d)>=0)L.push({i,x})})});L.sort((a,b)=>a.x.d+a.x.t<b.x.d+b.x.t?-1:1);if(!L.length)return '';return `<div class="card" style="margin:10px 0 0"><h2>Exam timetable</h2><p class="mu" style="margin:0 0 4px">${L.length} papers to go. Next: ${E(shn(L[0].i))}, ${exCd(L[0].x.d)[0]}.</p>${L.map(({i,x})=>exCard(i,x)).join('')}</div>`}
function render(){applyTheme();nav();({today,todo,calendar,subjects,progress,set:custom}[S.tab])()}if(S.sess&&S.subs[S.sess.i]&&Date.now()-(S.sess.u||0)<432e5){T=S.sess;if(T.run&&Date.now()-(T.u||0)>9e4){T.acc=T.hb||T.acc;T.run=false;sv()}tkStart();paint();tick()}else{S.sess=null}
render();
</script></body></html>
